{"name": "Build APK dari ZIP", "permissions": {"contents": "read"}, "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"name": "Checkout", "uses": "actions/checkout@v4"}, {"name": "Ekstrak ZIP proyek", "run": "ZIP=$(ls Suara*.zip | head -n 1)\necho \"Mengekstrak $ZIP\"\nmkdir -p proyek\nunzip -q -o \"$ZIP\" -d proyek\nDIR=$(dirname \"$(find proyek -name settings.gradle.kts | head -n 1)\")\necho \"Folder proyek: $DIR\"\necho \"PROJECT_DIR=$DIR\" >> \"$GITHUB_ENV\"\n"}, {"name": "Set up Java 17", "uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"name": "Set up Android SDK", "uses": "android-actions/setup-android@v3", "with": {"packages": "platforms;android-35 build-tools;35.0.0"}}, {"name": "Set up Gradle 8.9", "uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}}, {"name": "Build debug APK", "working-directory": "${{ env.PROJECT_DIR }}", "run": "gradle --no-daemon :app:assembleDebug"}, {"name": "Upload APK", "uses": "actions/upload-artifact@v4", "with": {"name": "suara-tokoh-apk", "path": "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk", "if-no-files-found": "error"}}]}}, "on": {"workflow_dispatch": null, "push": {"branches": ["main"]}}}
